<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<h1>❤️ Heart Disease Prediction</h1>
<p style="text-align:center;color:gray;margin-bottom:25px;">

Predict the likelihood of heart disease using a trained Machine Learning model.

</p>
<form action="/predict" method="POST">

<label>Age</label>
<input type="number" name="age" min="1" max="120" required>
<label>Sex</label>
<select name="sex">
    <option value="Male">Male</option>
    <option value="Female">Female</option>
</select>

<label>Chest Pain Type</label>
<select name="cp">
    <option value="typical angina">Typical Angina</option>
    <option value="atypical angina">Atypical Angina</option>
    <option value="non-anginal">Non-anginal</option>
    <option value="asymptomatic">Asymptomatic</option>
</select>

<label>Resting Blood Pressure</label>
<input type="number" name="trestbps" min="50" max="250" required>

<label>Cholesterol</label>
<input type="number" name="chol" min="50" max="700" required>

<label>Maximum Heart Rate</label>
<input type="number" name="thalch" min="50" max="250" required>

<label>Old Peak</label>
<input type="number" step="0.1" name="oldpeak" required>

<label>Number of Major Vessels (ca)</label>
<input type="number" name="ca" min="0" max="3" required>

<label>Fasting Blood Sugar > 120 mg/dl</label>
<select name="fbs">
    <option value="True">True</option>
    <option value="False">False</option>
</select>

<label>Rest ECG</label>
<select name="restecg">
    <option value="normal">Normal</option>
    <option value="lv hypertrophy">LV Hypertrophy</option>
    <option value="st-t abnormality">ST-T Abnormality</option>
</select>

<label>Exercise Induced Angina</label>
<select name="exang">
    <option value="True">True</option>
    <option value="False">False</option>
</select>

<label>Slope</label>
<select name="slope">
    <option value="upsloping">Upsloping</option>
    <option value="flat">Flat</option>
    <option value="downsloping">Downsloping</option>
</select>

<label>Thal</label>
<select name="thal">
    <option value="normal">Normal</option>
    <option value="fixed defect">Fixed Defect</option>
    <option value="reversable defect">Reversable Defect</option>
</select>

<button type="submit">
❤️ Predict Heart Disease
</button>
<button type="reset" class="reset-btn">🔄 Reset Form</button>
</form>
{% if prediction %}

<div class="result">

<h2>Prediction Result</h2>

<br>

<h3>{{ prediction }}</h3>

<br>

<p><b>Model Used:</b> Random Forest Pipeline</p>

</div>

{% endif %}

</div>
<footer>
    <p>Developed by Thanmayee | Machine Learning using Flask & Random Forest</p>
</footer>
</body>

</html>
